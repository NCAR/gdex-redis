name: Container Build

on:
  pull_request:
    types:
      - closed
    branches:
      - main
    paths-ignore:
      - ".github/**"
      - ".gitignore"
      - "app-chart/**"
      - "README.md"
      - "LICENSE"
  workflow_dispatch:
    inputs:
      run_reason:
        description: 'Provide a reason or comment for this workflow'
        required: false
        type: string
        default: 'No comment provided'

jobs:
  container-rebuild:
    if: github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
    
      - name: 1) Log in to Harbor 
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.CALIE_HARBOR_USERNAME }}
          password: ${{ secrets.CALIE_HARBOR_PASSWORD }}
          registry: hub.k8s.ucar.edu/calie-gdex
          
      - name: 2) Checkout gdex-celery-redis-demo repository
        uses: actions/checkout@v4
        with:
          ref: main
          ssh-key: ${{ secrets.ACTIONS_PUSH_KEY }}
        
