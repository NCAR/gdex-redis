apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: {{ .Release.Namespace }}
  labels:
    app: redis
spec:
  replicas: {{ .Values.replicaCount }}
  # The data volume is ReadWriteOnce: stop the old pod before starting the new one
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      securityContext:
        fsGroup: 999
      containers:
      - name: redis
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        args:
        - --dir
        - /data
        - --appendonly
        - {{ .Values.redis.appendonly | quote }}
        - --appendfsync
        - {{ .Values.redis.appendfsync | quote }}
        - --maxmemory
        - {{ .Values.redis.maxmemory | quote }}
        - --maxmemory-policy
        - {{ .Values.redis.maxmemoryPolicy | quote }}
        ports:
        - containerPort: {{ .Values.service.port }}
        readinessProbe:
          exec:
            command: ["redis-cli", "-p", "{{ .Values.service.port }}", "ping"]
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          exec:
            command: ["redis-cli", "-p", "{{ .Values.service.port }}", "ping"]
          initialDelaySeconds: 30
          periodSeconds: 10
        resources:
          requests:
            cpu: {{ .Values.resources.requests.cpu }}
            memory: {{ .Values.resources.requests.memory }}
          limits:
            cpu: {{ .Values.resources.limits.cpu }}
            memory: {{ .Values.resources.limits.memory }}
        volumeMounts:
        - name: data
          mountPath: /data
      volumes:
      - name: data
        {{- if .Values.persistence.enabled }}
        persistentVolumeClaim:
          claimName: {{ .Values.persistence.existingClaim | default "redis-data" }}
        {{- else }}
        emptyDir: {}
        {{- end }}
