replicaCount: 1

image:
  repository: hub.k8s.ucar.edu/calie-gdex/redis
  tag: v36634296973
  pullPolicy: Always

resources:
  requests:
    cpu: "0.5"
    memory: 1Gi
  limits:
    cpu: "1"
    memory: 2Gi

service:
  port: 6379

persistence:
  enabled: true
  # Use a pre-existing PVC instead of creating one
  existingClaim: ""
  # Empty string uses the cluster's default StorageClass
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 5Gi

redis:
  appendonly: "yes"
  appendfsync: everysec
  # Keep below resources.limits.memory; noeviction so queued tasks are never dropped
  maxmemory: 1536mb
  maxmemoryPolicy: noeviction
